name: CI Checks

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'

jobs:
  shell-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate Bash syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Test startup arguments
        run: python3 -B -m unittest discover -s tests -v

  docker-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build Docker image
        run: docker build -t palworld-server:ci .

      - name: Check image runtime dependencies
        run: |
          docker run --rm --network none --entrypoint /bin/bash palworld-server:ci -ec '
            for tool in curl tar gzip pgrep ps timeout awk; do
              command -v "$tool"
            done
            test "$(locale charmap)" = UTF-8
            ldd /steamcmd/linux32/steamcmd > /tmp/steamcmd-dependencies
            cat /tmp/steamcmd-dependencies
            ! grep -q "not found" /tmp/steamcmd-dependencies
          '
