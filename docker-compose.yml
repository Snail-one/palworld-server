services:
  palworld-server:
    image: ghcr.io/snail-one/palworld-server
    container_name: palworld-server
    restart: on-failure  # 未确认配置时正常退出并保持停止，异常退出时自动重启
    ports:
      - "8211:8211/udp"  # 游戏端口
    environment:
      # 官方启动参数 (在scripts/start.sh中实际使用)
      - SERVER_PORT=8211  # 服务器端口 (-port=8211)
      - MAX_PLAYERS=16  # 最大玩家数量 (-players=16)
      - PUBLIC_IP=  # 社区服务器公网IP地址，留空由游戏自动检测 (-publicip=x.x.x.x)
      - PUBLIC_PORT=  # 社区服务器公网端口，留空由游戏自动检测，不改变监听端口 (-publicport=xxxx)
      - PUBLIC_LOBBY=false  # 是否为社区服务器 (-publiclobby)
      - ENABLE_MULTITHREADING=false  # 可选多线程参数；v1.0及以后不设置可能性能更好
      - WORKER_THREADS=  # 工作线程数，设置时必须启用ENABLE_MULTITHREADING (-NumberOfWorkerThreadsServer=X)
      - LOG_FORMAT=text  # 日志格式：text或json (-logformat=text)
      - ENABLE_GAMEDATA_API=false  # 启用GameData API (-enable-gamedata-api)

      # 容器管理参数 (entrypoint.sh和其他脚本中使用)
      - CHECK_UPDATE=true  # 启动时检查更新
      - FORCE_UPDATE_ON_START=false  # 每次启动都强制更新（跳过版本检查）
      - SKIP_CONFIG_WAIT=false  # 是否自动确认配置并直接启动
      
      # 服务器路径变量 (在多个脚本中引用)
      - SERVER_DIR=/palworld-server  # 服务器数据目录
      
      # SteamCMD相关变量 (update.sh中使用)
      - GAME_ID=2394010  # 幻兽帕鲁服务器的Steam应用ID
      - STEAMCMD_DIR=/steamcmd  # SteamCMD安装目录

    volumes:
      - ./palworld:/palworld-server  # 服务器数据目录
      - ./config:/palworld-server/Pal/Saved/Config/LinuxServer  # 独立配置目录
    tty: true
    stdin_open: true 
    mem_limit: 8g
    healthcheck:
      test: [ "CMD", "/scripts/status.sh" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
